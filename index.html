<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Questor Work</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="icon" type="image/svg+xml" href="./public/favicon.ico" />
  </head>
  <body class=" text-gray-500 font-roboto">

    <div class="grid md:grid-cols-3">

        <div class="md:grid-cols-1 md:flex md:justify-end m-2">

            <nav class="md:text-right">
                <div class="flex justify-between items-center">
                    <h1 class="font-bold uppercase p-4 border-b border-gray-100 ">
                        <a href="/" class="hover:text-gray-700">Questor Work</a>
                    </h1>
                    <div class="px-2 md:hidden" id="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                        </svg>
                    </div>

                </div>

                <ul class="font-bold text-sm mt-5 hidden md:block" id="menu">
                    <li class="text-gray-700 py-1 border-r-4 border-amber-300">
                        <a href="#" class="px-4 flex justify-end hover:text-amber-300">
                            

                            <span>Home</span>
                            <svg class="ml-2 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                            </svg>
                        </a>
                    </li>

                     <li class="py-1 ">
                        <a href="#" class="px-4 flex justify-end hover:text-amber-300">
                            

                            <span>About</span>
                            <svg class="ml-2 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
                            </svg>
                        </a>
                    </li>

                     <li class="py-1 ">
                        <a href="#" class="px-4 flex justify-end hover:text-amber-300">
                            <span>Contact</span>
                            <svg class="ml-2 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                            </svg>
                        </a>
                    </li>


                </ul>
            </nav>

        </div>




        <main class="px-16 py-8 bg-gray-100 md:col-span-2 h-full">
            <div class="flex justify-center md:justify-end">
                <a href="#" class="button ">Login</a>
                <a href="#" class="ml-2 button ">Sign Up</a>
            </div>

            <header class="font-semibold" >
                <h2 class="text-gray-500 font-semibold text-5xl">Recipes</h2>
                <h3 class="text-2xl font-semibold">For Questor</h3>
            </header>

            <div>
                <h4 class="font-bold mt-12 pb-2 border-b border-gray-200">Latest</h4>

                <div class="mt-8 grid md:grid-cols-3 gap-10">

                    <!--card here-->
                    <div class="card">
                        <img src="/img/noodles.jpg" alt="Noodles " class="w-full h-32 sm:h-48 object-cover">
                        <div class="m-4">
                            <span class="font-bold ">Noodles</span>
                            <span class="block text-gray-500 text-sm">Made by Fabrizio</span>
                        </div>
                        <div class="badge">
                            <svg class="inline-block w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                            <span>25 Mins</span>
                        </div>
                    </div>

                    <div class="card"><!--card here-->
                        <img src="/img/stew.jpg" alt="Stew" class="w-full h-32 sm:h-48 object-cover">
                        <div class="m-4">
                            <span class="font-bold ">Stew</span>
                            <span class="block text-gray-500 text-sm">Made by Romano</span>
                        </div>
                        <div class="badge">
                            <svg class="inline-block w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                            <span>30 Mins</span>
                        </div>
                    </div>

                    <div class="card"><!--card here-->
                        <img src="/img/curry.jpg" alt="Curry" class="w-full h-32 sm:h-48 object-cover">
                        <div class="m-4">
                            <span class="font-bold ">Curry</span>
                            <span class="block text-gray-500 text-sm">Made by Elle</span>
                        </div>
                        <div class="badge">
                            <svg class="inline-block w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                            <span>45 Mins</span>
                        </div>
                    </div>

                    
                    
                </div>

                <h4 class="font-bold mt-12 pb-2 border-b border-gray-200">Popular</h4>
                <div class="mt-8">
                    <!--Card here-->
                </div>

                <div class="flex justify-center">
                    <div class="button  ">Load More</div>
                </div>
            </div>
        </main>
    </div>
  </body>


  <script src="./src/main.js"></script>
</html>
